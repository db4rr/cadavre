<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadavre exquis</title>
<style>
  :root { color-scheme: light dark; }
  html, body { overscroll-behavior: none; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; font: 20px/1.5 Georgia, 'Times New Roman', serif; }
  main { width: min(36rem, 90vw); padding: 2rem 0; }
  h1 { font-size: 1rem; font-weight: normal; letter-spacing: .2em; text-transform: uppercase; opacity: .5; margin: 0 0 2rem; }
  .done { margin: 0; opacity: .3; }
  .q { font-size: 2rem; margin: .5rem 0 1rem; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem 0; border: 0; border-bottom: 2px solid currentColor; background: transparent; color: inherit; outline: none; }
  button { font: inherit; margin-top: 1.5rem; padding: .4rem 1.2rem; cursor: pointer; }
  .slider { position: relative; height: 3rem; margin-top: 1.5rem; border-radius: 1.5rem; background: rgba(128, 128, 128, .25); overflow: hidden; user-select: none; -webkit-user-select: none; }
  .slider.off { opacity: .35; pointer-events: none; }
  .slider-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: .9rem; letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
  .knob { position: absolute; top: .25rem; left: .25rem; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; background: CanvasText; color: Canvas; cursor: grab; touch-action: none; transition: transform .2s; }
  .knob.drag { transition: none; cursor: grabbing; }
  .relays { font-size: .75rem; opacity: .45; margin-top: 1.5rem; }
  .linkrow { display: flex; align-items: center; gap: .6rem; margin: 1rem 0; }
  .link { flex: 0 1 auto; min-width: 0; margin: 0; font-size: .8rem; opacity: .6; word-break: break-all; cursor: pointer; }
  .linkrow button { flex: none; margin: 0; padding: .15rem .6rem; font-size: .8rem; }
  .story { font-size: 1.5rem; line-height: 1.7; white-space: pre-line; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
// <core>
const QUESTIONS = ['Who?', 'Where?', 'When?', 'With whom?', 'What were they doing?', 'Why?', 'What did they say?', 'What happened next?', 'How did it end?'];

function assemble(roster, answers, p) {
  const n = roster.length;
  return QUESTIONS.map((_, k) => answers[roster[(p + k) % n]]?.[k] || '…');
}

function cleanAnswer(text) {
  return String(text).replace(/\s+/g, ' ').trim();
}

function formatStory(lines) {
  return lines.map((line) => line.replace(/^\p{L}/u, (c) => c.toUpperCase())).join('\n');
}

function mergeAnswer(answers, playerId, q, text) {
  const clean = cleanAnswer(text);
  if (!clean) return answers;
  const prev = answers[playerId] || [];
  const mine = QUESTIONS.map((_, i) => (i === q ? clean : prev[i]));
  return { ...answers, [playerId]: mine };
}

function mergeRoster(current, incoming) {
  return [...new Set([...(current || []), ...incoming])].sort();
}

function nextQuestion(answers, playerId) {
  const mine = answers[playerId] || [];
  const i = QUESTIONS.findIndex((_, q) => !mine[q]);
  return i === -1 ? QUESTIONS.length : i;
}

function allDone(roster, answers) {
  return roster.every((id) => nextQuestion(answers, id) === QUESTIONS.length);
}

function reduce(state, type, data) {
  switch (type) {
    case 'hello':
      return state.known.includes(data.playerId) ? state : { ...state, known: [...state.known, data.playerId] };
    case 'bye':
      return state.roster ? state : { ...state, known: state.known.filter((id) => id !== data.playerId) };
    case 'roster':
      return { ...state, roster: mergeRoster(state.roster, data.roster) };
    case 'answer':
      return { ...state, answers: mergeAnswer(state.answers, data.playerId, data.q, data.text) };
    default:
      return state;
  }
}

function viewKey(state, forceReveal) {
  const { roster, playerId, answers } = state;
  if (!roster) return 'lobby';
  if (!roster.includes(playerId)) return 'closed';
  const q = nextQuestion(answers, playerId);
  if (q < QUESTIONS.length) return 'q' + q;
  return allDone(roster, answers) || forceReveal ? 'story' : 'wait';
}

function startRoster(state) {
  return [...state.known].sort();
}

function slideConfirmed(pos, max) {
  return max > 0 && pos / max >= 0.9;
}

function isConfirmKey(e) {
  return e.key === 'Enter' && e.shiftKey;
}
// </core>

// <crypto>
const textEnc = new TextEncoder();
const toB64 = (bytes) => btoa(String.fromCharCode(...bytes));
const fromB64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));

async function deriveRoom(roomId) {
  const material = await crypto.subtle.importKey('raw', textEnc.encode(roomId), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: textEnc.encode('cadavre-exquis-v1'), iterations: 100000 },
    material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', textEnc.encode('topic:' + roomId)));
  const topic = 'cadavre/' + [...digest.slice(0, 12)].map((b) => b.toString(16).padStart(2, '0')).join('');
  return { topic, key };
}

async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textEnc.encode(JSON.stringify(obj))));
  return toB64([...iv, ...ct]);
}

async function open(key, str) {
  try {
    const bytes = fromB64(str);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch {
    return null;
  }
}
// </crypto>

// <transport>
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081', 'wss://broker.emqx.io:8084/mqtt'];
const MQTT_SRC = 'https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js';
const MQTT_SRI = 'sha384-ilRYg/zm2XqUafLvBoGVk40UfNRnvUkYMy+e/JPo4YgsFR6X9Q3jYEkqFQXquX4r';

// raw: { send(obj), close(), onmessage(obj), onopen(again), onstatus({up, total}) }; send may be async.
function makeBus(raw) {
  const msgHandlers = [];
  const joinHandlers = [];
  const leaveHandlers = [];
  const statusHandlers = [];
  const emit = (list, ...args) => list.forEach((fn) => fn(...args));
  const me = Math.random().toString(36).slice(2);
  const known = new Set();

  raw.onmessage = (m) => {
    if (m.from === me) return;
    if (m.kind === 'ping') {
      if (!known.has(m.from) || m.rejoin) {
        known.add(m.from);
        emit(joinHandlers, m.from);
        if (!m.reply) raw.send({ kind: 'ping', reply: true, from: me });
      }
    } else if (m.kind === 'bye') {
      known.delete(m.from);
      emit(leaveHandlers, m.from);
    } else {
      emit(msgHandlers, m.type, m.data, m.from);
    }
  };
  raw.onopen = (again) => raw.send({ kind: 'ping', from: me, rejoin: !!again });
  raw.onstatus = (status) => emit(statusHandlers, status);

  return {
    onMessage: (fn) => msgHandlers.push(fn),
    onPeerJoin: (fn) => joinHandlers.push(fn),
    onPeerLeave: (fn) => leaveHandlers.push(fn),
    onStatus: (fn) => statusHandlers.push(fn),
    send: (type, data) => raw.send({ kind: 'msg', type, data, from: me }),
    close: async () => {
      await raw.send({ kind: 'bye', from: me });
      raw.close();
    },
  };
}

function connectLocal(roomId) {
  const channel = new BroadcastChannel('cadavre-' + roomId);
  const raw = { send: (m) => channel.postMessage(m), close: () => channel.close() };
  channel.onmessage = ({ data }) => raw.onmessage(data);
  const bus = makeBus(raw);
  raw.onopen();
  return bus;
}

async function connectRelay(roomId, urls, mqttConnect) {
  const { topic, key } = await deriveRoom(roomId);
  const seen = new Set();
  const live = new Set();
  const raw = {};
  let everUp = false;

  const clients = urls.map((url) => {
    const client = mqttConnect(url, { reconnectPeriod: 3000, connectTimeout: 10000 });
    const status = () => raw.onstatus?.({ up: live.size, total: urls.length });
    const down = () => { live.delete(client); status(); };
    client.on('connect', () => {
      client.subscribe(topic, { qos: 1 }, (err) => {
        if (err) return;
        const wasDown = live.size === 0;
        live.add(client);
        status();
        if (wasDown) { raw.onopen?.(everUp); everUp = true; }
      });
    });
    client.on('close', down);
    client.on('offline', down);
    client.on('error', () => {});
    client.on('message', async (_topic, payload) => {
      const text = typeof payload === 'string' ? payload : new TextDecoder().decode(payload);
      const env = await open(key, text);
      if (!env || seen.has(env.id)) return;
      seen.add(env.id);
      raw.onmessage?.(env.body);
    });
    return client;
  });

  raw.send = async (body) => {
    const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    seen.add(id);
    const payload = await seal(key, { id, body });
    for (const client of live) client.publish(topic, payload, { qos: 1 });
  };
  raw.close = () => clients.forEach((client) => client.end());
  return makeBus(raw);
}

async function connect(roomId, local) {
  if (local) return connectLocal(roomId);
  if (!window.mqtt) {
    await new Promise((resolve, reject) => {
      const script = Object.assign(document.createElement('script'), {
        src: MQTT_SRC,
        integrity: MQTT_SRI,
        crossOrigin: 'anonymous',
        onload: resolve,
        onerror: () => reject(new Error('mqtt.js failed to load')),
      });
      document.head.append(script);
    });
  }
  return connectRelay(roomId, BROKERS, (url, opts) => window.mqtt.connect(url, opts));
}
// </transport>

// ---- app ----
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
};

const hash = location.hash.slice(1);
if (!hash) location.hash = [...crypto.getRandomValues(new Uint8Array(10))].map((b) => (b % 36).toString(36)).join('');
const [roomId, flags] = (location.hash.slice(1)).split('?');
const local = flags === 'local';
const storeKey = 'cadavre:' + roomId;
if (local && !window.name) window.name = Math.random().toString(36).slice(2);
const idKey = 'cadavre:id' + (window.name ? ':' + window.name : '');
const playerId = localStorage[idKey] || (localStorage[idKey] = Math.random().toString(36).slice(2, 10));

const saved = JSON.parse(localStorage[storeKey] || '{}');
let state = { playerId, known: [playerId], roster: saved.roster || null, answers: saved.answers || {} };
let forceReveal = false;
const app = document.getElementById('app');
app.replaceChildren(el('p', {}, 'Connecting…'));
let net;
try {
  net = await connect(roomId, local);
} catch (err) {
  app.replaceChildren(el('p', {}, "Couldn't connect. Check your network and reload."));
  throw err;
}
addEventListener('pagehide', () => net.close());
const peerPlayer = {};
let lastKey = null;
let copied = null;
let confirmAction = null;
let relays = null;

function update(type, data) {
  state = reduce(state, type, data);
  localStorage[storeKey] = JSON.stringify({ roster: state.roster, answers: state.answers });
  render();
}

function broadcast(type, data) {
  net.send(type, data);
  update(type, data);
}

net.onMessage((type, data, peerId) => {
  if (type === 'hello') peerPlayer[peerId] = data.playerId;
  const before = JSON.stringify(state.roster);
  update(type, data);
  if (type === 'roster' && JSON.stringify(state.roster) !== before) net.send('roster', { roster: state.roster });
});
net.onPeerLeave((peerId) => {
  if (peerPlayer[peerId]) update('bye', { playerId: peerPlayer[peerId] });
});
net.onPeerJoin(() => {
  net.send('hello', { playerId });
  if (state.roster) net.send('roster', { roster: state.roster });
  for (const [id, lines] of Object.entries(state.answers)) {
    lines.forEach((text, q) => text && net.send('answer', { playerId: id, q, text }));
  }
});
net.onStatus((status) => {
  relays = status;
  if (lastKey === 'lobby') render();
});
net.send('hello', { playerId });

addEventListener('keydown', (e) => {
  if (isConfirmKey(e) && confirmAction) {
    e.preventDefault();
    confirmAction();
  }
});

async function copyText(text, which, fallbackEl) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    getSelection().selectAllChildren(fallbackEl);
    return;
  }
  const key = lastKey;
  copied = which;
  render(true);
  setTimeout(() => {
    copied = null;
    if (lastKey === key) render(true);
  }, 1500);
}

function render(force = false) {
  const key = viewKey(state, forceReveal);
  if (key === lastKey && key.startsWith('q') && !force) return;
  lastKey = key;
  confirmAction = null;
  app.replaceChildren(el('h1', {}, 'Cadavre exquis'));
  if (key === 'lobby') return renderLobby();
  if (key === 'closed') return app.append(el('p', {}, 'This game has already started. Open a new room to play.'));
  if (key === 'story') return renderStory();
  if (key === 'wait') return renderWaiting();
  renderQuestion(Number(key.slice(1)));
}

function slider(label, onConfirm) {
  const labelEl = el('span', { className: 'slider-label' }, label);
  const knob = el('div', { className: 'knob' }, '›');
  const node = el('div', { className: 'slider' }, labelEl, knob);
  let startX = 0, max = 0, pos = 0, done = false, disabled = false;
  const move = (x) => {
    pos = Math.min(Math.max(x - startX, 0), max);
    knob.style.transform = `translateX(${pos}px)`;
    labelEl.style.opacity = 1 - pos / max;
  };
  const onMove = (e) => move(e.clientX);
  const onUp = () => {
    removeEventListener('pointermove', onMove);
    removeEventListener('pointerup', onUp);
    removeEventListener('pointercancel', onUp);
    knob.classList.remove('drag');
    if (slideConfirmed(pos, max)) {
      done = true;
      move(startX + max);
      onConfirm();
    } else {
      move(startX);
    }
  };
  knob.onpointerdown = (e) => {
    if (done) return;
    knob.classList.add('drag');
    max = node.clientWidth - knob.offsetWidth - 2 * knob.offsetLeft;
    startX = e.clientX;
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
  };
  return {
    node,
    setDisabled: (off) => {
      disabled = off;
      node.classList.toggle('off', off);
    },
    confirm: () => {
      if (done || disabled) return;
      done = true;
      startX = 0;
      max = node.clientWidth - knob.offsetWidth - 2 * knob.offsetLeft;
      move(max);
      onConfirm();
    },
  };
}

function renderLobby() {
  const copy = () => copyText(location.href, 'link', link);
  const link = el('p', { className: 'link', title: 'Click to copy', onclick: copy }, location.href);
  const copyBtn = el('button', { onclick: copy }, copied === 'link' ? 'Copied ✓' : 'Copy');
  const start = slider('Slide to start', () => broadcast('roster', { roster: startRoster(state) }));
  confirmAction = start.confirm;
  app.append(el('p', {}, 'Share this link, then start when everyone is here.'), el('div', { className: 'linkrow' }, link, copyBtn), el('p', {}, `${state.known.length} player${state.known.length === 1 ? '' : 's'} here`), start.node, ...(relays ? [el('p', { className: 'relays' }, relays.up ? `Connected to ${relays.up} of ${relays.total} relays` : 'Connecting to relays…')] : []));
}

function renderQuestion(q) {
  const input = el('input', { type: 'text', autocomplete: 'off', maxLength: 300 });
  const submit = slider('Slide to submit', () => {
    const text = cleanAnswer(input.value);
    if (text) broadcast('answer', { playerId, q, text });
  });
  submit.setDisabled(true);
  confirmAction = submit.confirm;
  input.oninput = () => submit.setDisabled(!cleanAnswer(input.value));
  app.append(...QUESTIONS.slice(0, q).map((t) => el('p', { className: 'done' }, t)), el('p', { className: 'q' }, QUESTIONS[q]), input, submit.node);
  input.focus();
}

function renderWaiting() {
  const pending = state.roster.filter((id) => nextQuestion(state.answers, id) < QUESTIONS.length).length;
  app.append(
    el('p', {}, `Waiting for ${pending} other${pending === 1 ? '' : 's'}…`),
    el('button', { onclick: () => { forceReveal = true; render(); } }, 'Reveal anyway'),
  );
}

function renderStory() {
  const lines = assemble(state.roster, state.answers, state.roster.indexOf(playerId));
  const text = formatStory(lines);
  const story = el('p', { className: 'story' }, text);
  app.append(story, el('button', { onclick: () => copyText(text, 'story', story) }, copied === 'story' ? 'Copied ✓' : 'Copy story'));
}

render();
</script>
</body>
</html>
