<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadavre exquis</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 20px/1.5 Georgia, 'Times New Roman', serif; }
  main { width: min(36rem, 90vw); padding: 2rem 0; }
  h1 { font-size: 1rem; font-weight: normal; letter-spacing: .2em; text-transform: uppercase; opacity: .5; margin: 0 0 2rem; }
  .done { margin: 0; opacity: .3; }
  .q { font-size: 2rem; margin: .5rem 0 1rem; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem 0; border: 0; border-bottom: 2px solid currentColor; background: transparent; color: inherit; outline: none; }
  button { font: inherit; margin-top: 1.5rem; padding: .4rem 1.2rem; cursor: pointer; }
  .linkrow { display: flex; align-items: center; gap: .6rem; margin: 1rem 0; }
  .link { flex: 0 1 auto; min-width: 0; margin: 0; font-size: .8rem; opacity: .6; word-break: break-all; cursor: pointer; }
  .linkrow button { flex: none; margin: 0; padding: .15rem .6rem; font-size: .8rem; }
  .story { font-size: 1.5rem; line-height: 1.7; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
// <core>
const QUESTIONS = ['Who?', 'Where?', 'When?', 'With whom?', 'What were they doing?', 'Why?', 'What did they say?', 'What happened next?', 'How did it end?'];

function assemble(roster, answers, p) {
  const n = roster.length;
  return QUESTIONS.map((_, k) => answers[roster[(p + k) % n]]?.[k] || '…');
}

function mergeAnswer(answers, playerId, q, text) {
  const prev = answers[playerId] || [];
  const mine = QUESTIONS.map((_, i) => (i === q ? text : prev[i]));
  return { ...answers, [playerId]: mine };
}

function mergeRoster(current, incoming) {
  return [...new Set([...(current || []), ...incoming])].sort();
}

function nextQuestion(answers, playerId) {
  const mine = answers[playerId] || [];
  const i = QUESTIONS.findIndex((_, q) => !mine[q]);
  return i === -1 ? QUESTIONS.length : i;
}

function allDone(roster, answers) {
  return roster.every((id) => nextQuestion(answers, id) === QUESTIONS.length);
}

function reduce(state, type, data) {
  switch (type) {
    case 'hello':
      return state.known.includes(data.playerId) ? state : { ...state, known: [...state.known, data.playerId] };
    case 'bye':
      return state.roster ? state : { ...state, known: state.known.filter((id) => id !== data.playerId) };
    case 'roster':
      return { ...state, roster: mergeRoster(state.roster, data.roster) };
    case 'answer':
      return { ...state, answers: mergeAnswer(state.answers, data.playerId, data.q, data.text) };
    default:
      return state;
  }
}

function viewKey(state, forceReveal) {
  const { roster, playerId, answers } = state;
  if (!roster) return 'lobby';
  if (!roster.includes(playerId)) return 'closed';
  const q = nextQuestion(answers, playerId);
  if (q < QUESTIONS.length) return 'q' + q;
  return allDone(roster, answers) || forceReveal ? 'story' : 'wait';
}

function startRoster(state) {
  return [...state.known].sort();
}
// </core>

// <transport>
async function connect(roomId, local) {
  const msgHandlers = [];
  const joinHandlers = [];
  const leaveHandlers = [];
  const emit = (list, ...args) => list.forEach((fn) => fn(...args));
  const api = {
    onMessage: (fn) => msgHandlers.push(fn),
    onPeerJoin: (fn) => joinHandlers.push(fn),
    onPeerLeave: (fn) => leaveHandlers.push(fn),
  };

  if (!local) {
    const { joinRoom } = await import('https://esm.run/trystero@0.26.0');
    const room = joinRoom({ appId: 'cadavre-exquis-dbarr' }, roomId);
    const action = room.makeAction('msg');
    room.onPeerJoin = (peerId) => emit(joinHandlers, peerId);
    room.onPeerLeave = (peerId) => emit(leaveHandlers, peerId);
    action.onMessage = (m, { peerId }) => emit(msgHandlers, m.type, m.data, peerId);
    return { ...api, send: (type, data) => action.send({ type, data }), close: () => room.leave() };
  }

  const me = Math.random().toString(36).slice(2);
  const known = new Set();
  const channel = new BroadcastChannel('cadavre-' + roomId);
  channel.onmessage = ({ data: m }) => {
    if (m.kind === 'ping') {
      if (!known.has(m.from)) {
        known.add(m.from);
        emit(joinHandlers, m.from);
        if (!m.reply) channel.postMessage({ kind: 'ping', reply: true, from: me });
      }
    } else if (m.kind === 'bye') {
      known.delete(m.from);
      emit(leaveHandlers, m.from);
    } else {
      emit(msgHandlers, m.type, m.data, m.from);
    }
  };
  channel.postMessage({ kind: 'ping', from: me });
  return {
    ...api,
    send: (type, data) => channel.postMessage({ kind: 'msg', type, data, from: me }),
    close: () => {
      channel.postMessage({ kind: 'bye', from: me });
      channel.close();
    },
  };
}
// </transport>

// ---- app ----
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
};

const hash = location.hash.slice(1);
if (!hash) location.hash = Math.random().toString(36).slice(2, 8);
const [roomId, flags] = (location.hash.slice(1)).split('?');
const local = flags === 'local';
const storeKey = 'cadavre:' + roomId;
const idKey = 'cadavre:id' + (local ? ':' + (window.name || (window.name = Math.random().toString(36).slice(2))) : '');
const playerId = localStorage[idKey] || (localStorage[idKey] = Math.random().toString(36).slice(2, 10));

const saved = JSON.parse(localStorage[storeKey] || '{}');
let state = { playerId, known: [playerId], roster: saved.roster || null, answers: saved.answers || {} };
let forceReveal = false;
const app = document.getElementById('app');
app.replaceChildren(el('p', {}, 'Connecting…'));
let net;
try {
  net = await connect(roomId, local);
} catch (err) {
  app.replaceChildren(el('p', {}, "Couldn't connect. Check your network and reload."));
  throw err;
}
addEventListener('pagehide', () => net.close());
const peerPlayer = {};
let lastKey = null;
let copied = false;

function update(type, data) {
  state = reduce(state, type, data);
  localStorage[storeKey] = JSON.stringify({ roster: state.roster, answers: state.answers });
  render();
}

function broadcast(type, data) {
  net.send(type, data);
  update(type, data);
}

net.onMessage((type, data, peerId) => {
  if (type === 'hello') peerPlayer[peerId] = data.playerId;
  const before = JSON.stringify(state.roster);
  update(type, data);
  if (type === 'roster' && JSON.stringify(state.roster) !== before) net.send('roster', { roster: state.roster });
});
net.onPeerLeave((peerId) => {
  if (peerPlayer[peerId]) update('bye', { playerId: peerPlayer[peerId] });
});
net.onPeerJoin(() => {
  net.send('hello', { playerId });
  if (state.roster) net.send('roster', { roster: state.roster });
  for (const [id, lines] of Object.entries(state.answers)) {
    lines.forEach((text, q) => text && net.send('answer', { playerId: id, q, text }));
  }
});
net.send('hello', { playerId });

function render(force = false) {
  const key = viewKey(state, forceReveal);
  if (key === lastKey && key.startsWith('q') && !force) return;
  lastKey = key;
  app.replaceChildren(el('h1', {}, 'Cadavre exquis'));
  if (key === 'lobby') return renderLobby();
  if (key === 'closed') return app.append(el('p', {}, 'This game has already started. Open a new room to play.'));
  if (key === 'story') return renderStory();
  if (key === 'wait') return renderWaiting();
  renderQuestion(Number(key.slice(1)));
}

function renderLobby() {
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      copied = true;
    } catch {
      getSelection().selectAllChildren(link);
    }
    render(true);
    setTimeout(() => { copied = false; render(true); }, 1500);
  };
  const link = el('p', { className: 'link', title: 'Click to copy', onclick: copy }, location.href);
  const copyBtn = el('button', { onclick: copy }, copied ? 'Copied ✓' : 'Copy');
  const start = el('button', { onclick: () => broadcast('roster', { roster: startRoster(state) }) }, 'Start');
  app.append(el('p', {}, 'Share this link, then start when everyone is here.'), el('div', { className: 'linkrow' }, link, copyBtn), el('p', {}, `${state.known.length} player${state.known.length === 1 ? '' : 's'} here`), start);
}

function renderQuestion(q) {
  const input = el('input', { type: 'text', autocomplete: 'off', maxLength: 300 });
  const submit = el('button', { type: 'submit', disabled: true }, 'Submit');
  input.oninput = () => (submit.disabled = !input.value.trim());
  const form = el('form', {}, input, submit);
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) broadcast('answer', { playerId, q, text });
  };
  app.append(...QUESTIONS.slice(0, q).map((t) => el('p', { className: 'done' }, t)), el('p', { className: 'q' }, QUESTIONS[q]), form);
  input.focus();
}

function renderWaiting() {
  const pending = state.roster.filter((id) => nextQuestion(state.answers, id) < QUESTIONS.length).length;
  app.append(
    el('p', {}, `Waiting for ${pending} other${pending === 1 ? '' : 's'}…`),
    el('button', { onclick: () => { forceReveal = true; render(); } }, 'Reveal anyway'),
  );
}

function renderStory() {
  const lines = assemble(state.roster, state.answers, state.roster.indexOf(playerId));
  app.append(el('p', { className: 'story' }, lines.join(' ')));
}

render();
</script>
</body>
</html>
